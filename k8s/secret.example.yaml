# Example secret. DO NOT commit real values.
# Create the real secret with kubectl instead of committing it, e.g.:
#   kubectl -n cloud-devops create secret generic app-secrets \
#     --from-literal=POSTGRES_DB=appdb \
#     --from-literal=POSTGRES_USER=user \
#     --from-literal=POSTGRES_PASSWORD='change-me' \
#     --from-literal=DATABASE_URL='postgresql://user:change-me@postgres:5432/appdb'
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cloud-devops
type: Opaque
stringData:
  POSTGRES_DB: appdb
  POSTGRES_USER: user
  POSTGRES_PASSWORD: change-me-strong-password
  DATABASE_URL: postgresql://user:change-me-strong-password@postgres:5432/appdb
