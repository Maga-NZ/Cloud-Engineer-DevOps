global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: 'default'
    # Configure a real notification channel here, for example:
    # webhook_configs:
    #   - url: 'https://example.com/alerts'
    # slack_configs:
    #   - api_url: '<slack-webhook-url>'
    #     channel: '#alerts'

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname']
