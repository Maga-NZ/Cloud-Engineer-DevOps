groups:
  - name: application-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job="python-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "The python-app target has been unreachable for more than 1 minute."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency (p95 > 1s)"
          description: "95th percentile latency has been above 1s for 5 minutes."

      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target missing ({{ $labels.job }})"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} is down."
