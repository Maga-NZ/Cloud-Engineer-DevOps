global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'python-app'
    static_configs:
      - targets: ['app:5000']
    metrics_path: '/metrics'

  # To scrape nginx metrics, run nginx-prometheus-exporter as a separate
  # service and point this job at it, e.g. targets: ['nginx-exporter:9113']. 